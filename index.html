document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rm:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">\n          <span style=\"display:block;color:var(--acct);animation:wtRise .9s cubic-bezier(.2,.8,.2,1) both\">WorkTime —<\u002Fspan>\n          <span style=\"display:block;font-size:.6em;line-height:.92;margin-top:.15em;white-space:nowrap\">\n            <span style=\"display:block;padding-left:8%;animation:wtRise .9s .1s cubic-bezier(.2,.8,.2,1) both\">Time tracker<\u002Fspan>\n            <span style=\"display:block;animation:wtRise .9s .2s cubic-bezier(.2,.8,.2,1) both\">with 3-level<\u002Fspan>\n            <span style=\"display:block;padding-left:16%;animation:wtRise .9s .3s cubic-bezier(.2,.8,.2,1) both\">task system<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fh1>\n        <div style=\"margin-top:36px;max-width:640px;font-size:19px;line-height:1.5\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px 28px;white-space:nowrap\">\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:9px;height:9px;background:var(--green);flex:none\"><\u002Fdiv>Free<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:9px;height:9px;background:var(--green);flex:none\"><\u002Fdiv>Simple interface<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:9px;height:9px;background:var(--green);flex:none\"><\u002Fdiv>Deep analytics<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:9px;height:9px;background:var(--green);flex:none\"><\u002Fdiv>Absolute time<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\"><div style=\"width:9px;height:9px;background:var(--green);flex:none\"><\u002Fdiv>Daily goal<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-top:56px\">\n          <a href=\"#\" title=\"Coming soon to Google Play\" style=\"display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:14px 26px 14px 20px\">\n            <div style=\"width:16px;height:19px;background:var(--acc);clip-path:polygon(0 0,100% 50%,0 100%)\"><\u002Fdiv>\n            <div><div style=\"font-family:'JetBrains Mono', monospace;font-size:10.5px;letter-spacing:.1em\">DOWNLOAD ON<\u002Fdiv><div style=\"font-size:21px;font-weight:700;margin-top:1px\">Google Play<\u002Fdiv><\u002Fdiv>\n          <\u002Fa>\n          <a href=\"#how\" style=\"display:flex;align-items:center;padding:0 24px;border:1px solid var(--ink);font-size:17px;font-weight:500\">How it works ↓<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 560px;min-width:0;position:relative;height:{{ heroH }};max-width:680px;animation:wtFade 1.1s .35s cubic-bezier(.2,.8,.2,1) both\">\n        <div style=\"position:absolute;left:12%;right:0;top:90px;bottom:30px;background:var(--acc)\"><\u002Fdiv>\n        <div style=\"position:absolute;right:3%;top:260px;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#101114;writing-mode:vertical-rl\">NET WORK TIME ONLY<\u002Fdiv>\n        <div style=\"position:absolute;left:{{ heroPhoneL }};top:0;z-index:2;transform:translateX({{ heroPhoneX }})\">\n          <dc-import name=\"AppPhone\" screen=\"timer\" theme=\"dark\" hint-size=\"308px,648px\"><\u002Fdc-import>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:52%;top:130px;z-index:1;display:{{ heroSecond }}\">\n          <dc-import name=\"AppPhone\" screen=\"stats\" theme=\"light\" hint-size=\"308px,648px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <div aria-hidden=\"true\" style=\"position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .07; mix-blend-mode: overlay; background-image: url(&quot;data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'&gt;&lt;filter id='n'&gt;&lt;feTurbulence type='fractalNoise' sc-camel-base-frequency='.9' sc-camel-num-octaves='2' sc-camel-stitch-tiles='stitch'/&gt;&lt;/filter&gt;&lt;rect width='100%' height='100%' filter='url(%23n)'/&gt;&lt;/svg&gt;&quot;); left: 494px; top: 587px\"><\u002Fdiv><\u002Fsection>\n\n    <section id=\"why\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(100px,12vw,180px) clamp(20px,4vw,56px) 40px\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px 32px\">\n        <div style=\"flex:1 1 220px;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding-top:14px\">01 — Motivation<\u002Fdiv>\n        <div style=\"flex:3 1 560px;min-width:0\">\n          <h2 style=\"margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Why this matters<\u002Fh2>\n          <p style=\"margin:36px 0 0;max-width:760px;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400;text-wrap:pretty\">Most people are uncertain about how much time they actually spend working. Research shows that people usually misjudge their working time by 20–30%.<\u002Fp>\n          <p style=\"margin:20px 0 0;max-width:760px;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400;text-wrap:pretty\">WorkTime helps you track your time. See how much you really work and better understand how your time is distributed across projects.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"levels\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(120px,14vw,200px) clamp(20px,4vw,56px) 0\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between\">\n        <h2 style=\"margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em;flex:1 1 520px\">\n          <span style=\"display:block;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-stretch:100%;margin-bottom:28px\">02 — Structure<\u002Fspan>\n          <span style=\"display:block\">Three-<\u002Fspan>\n          <span style=\"display:block;padding-left:18%\">level<\u002Fspan>\n          <span style=\"display:block;padding-left:6%;color:var(--pinkt)\">system<\u002Fspan>\n        <\u002Fh2>\n        <div style=\"flex:0 1 420px;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400\">\n          <p style=\"margin:0\">Not all projects are the same. Most trackers only have one level.<\u002Fp>\n          <p style=\"margin:18px 0 0\">WorkTime gives you three:<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:72px;align-items:start\">\n        <div style=\"background:var(--acc);color:#101114;padding:32px;min-height:340px;display:flex;flex-direction:column\">\n          <div style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">01<\u002Fdiv>\n          <div style=\"margin-top:auto;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600\">Areas<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:19px;line-height:1.5\">big categories (Client Work, Admin, Learning)<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"position:relative;color:#101114;padding:32px;min-height:340px;display:flex;flex-direction:column;margin-top:clamp(0px,6vw,80px);isolation:isolate\">\n          <div aria-hidden=\"true\" style=\"position:absolute;inset:0;display:flex;z-index:-1\"><div style=\"flex:1;background:oklch(0.9 0.06 225)\"><\u002Fdiv><div style=\"flex:1;background:oklch(0.83 0.08 225)\"><\u002Fdiv><div style=\"flex:1;background:oklch(0.76 0.1 225)\"><\u002Fdiv><div style=\"flex:1;background:oklch(0.69 0.1 228)\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">02<\u002Fdiv>\n          <div style=\"margin-top:auto;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600\">Projects<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:19px;line-height:1.5\">specific work inside an area<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg2);padding:32px;min-height:340px;display:flex;flex-direction:column;margin-top:clamp(0px,12vw,160px)\">\n          <div style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">03<\u002Fdiv>\n          <div style=\"margin-top:auto;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600\">Tasks<\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-size:19px;line-height:1.5\">individual steps within a project<\u002Fp>\n          <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:18px;text-transform:none\">· Brand guide &nbsp; · Icon set<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:48px 64px;align-items:center;margin-top:clamp(64px,8vw,110px)\">\n        <div style=\"flex:1 1 440px;min-width:0;max-width:720px\">\n          <p style=\"margin:0;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400;text-wrap:pretty\">Set as many work areas as you need. Go deep with projects inside them and individual tasks. Turn off the third level if you don't need it. Archive any element to hide it from this screen when the project is over. Your stats stay the same.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:40px;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">\n            <div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:10px;height:10px;background:#f0508a;flex:none\"><\u002Fdiv>Client Work<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;padding-left:24px\"><div style=\"width:10px;height:10px;background:#c9537b;flex:none\"><\u002Fdiv>Northwind<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;padding-left:48px\"><span style=\"width:10px;text-align:center\">·<\u002Fspan>Brand guide<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;margin:0 auto\">\n          <dc-import name=\"AppPhone\" screen=\"projects\" theme=\"dark\" open=\"client\" hint-size=\"308px,648px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"stats\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(120px,14vw,200px) clamp(20px,4vw,56px) 0\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:56px 64px;align-items:center\">\n        <div style=\"flex:1 1 520px;min-width:0\">\n          <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">03 — Statistics<\u002Fdiv>\n          <h2 style=\"margin:28px 0 0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\"><span style=\"display:block\">Stats at<\u002Fspan><span style=\"display:block;padding-left:12%\">every <span style=\"color:var(--acct)\">level<\u002Fspan><\u002Fspan><\u002Fh2>\n          <p style=\"margin:32px 0 0;max-width:620px;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400\">See totals for each area, project and task. Day, week, month, quarter, year.<\u002Fp>\n          <p style=\"margin:20px 0 0;max-width:560px;font-size:19px;line-height:1.5\">Areas are always visible in Details. Tick Projects and Tasks to nest them underneath, so one list shows the whole picture.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:36px;max-width:620px\">\n            <div style=\"padding-left:0\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Area · Client Work<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:32px;line-height:1\">29h 3m<\u002Fspan><\u002Fdiv>\n              <div style=\"height:8px;margin-top:6px;background:var(--bg2)\"><div style=\"width:100%;height:100%;background:#f0508a\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-left:8%\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Project · Northwind<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:32px;line-height:1\">21h 9m<\u002Fspan><\u002Fdiv>\n              <div style=\"height:8px;margin-top:6px;background:var(--bg2)\"><div style=\"width:73%;height:100%;background:#c9537b\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-left:16%\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Task · Brand guide<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:32px;line-height:1\">15h 24m<\u002Fspan><\u002Fdiv>\n              <div style=\"height:8px;margin-top:6px;background:var(--bg2)\"><div style=\"width:53%;height:100%;background:#7d1639\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;margin:0 auto\">\n          <dc-import name=\"AppPhone\" screen=\"details\" theme=\"dark\" hint-size=\"308px,648px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"absolute\" style=\"scroll-margin-top:70px;background:#0c0d0f;color:#f3f3f1;margin-top:clamp(180px,18vw,280px)\">\n      <div style=\"max-width:1440px;margin:0 auto;padding:clamp(90px,10vw,150px) clamp(20px,4vw,56px)\">\n        <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">04 — Absolute time feature<\u002Fdiv>\n        <h2 style=\"margin:32px 0 0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">\n          <span style=\"display:block\">24 hours in a day.<\u002Fspan>\n          <span style=\"display:block;padding-left:14%;color:#b8bccb\">8 hours sleep.<\u002Fspan>\n          <span style=\"display:block;color:oklch(0.8 0.1 225)\">How much time remains?<\u002Fspan>\n        <\u002Fh2>\n        <div ref=\"{{ stripRef }}\" style=\"margin-top:clamp(56px,7vw,96px)\">\n          <div style=\"display:flex;gap:6px;margin-bottom:16px\">\n            <sc-for list=\"{{ absModes }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ m.select }}\" style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;white-space:nowrap;line-height:1;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:{{ m.bg }};color:{{ m.fg }}\">{{ m.name }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;height:clamp(90px,10vw,140px);background:rgba(255,255,255,.03)\">\n            <div style=\"width:{{ sw.sleep }};transition:width .9s cubic-bezier(.2,.8,.2,1);background:#3a3c44;overflow:hidden;flex:none\">\n              <div style=\"padding:16px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;white-space:nowrap\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Sleep<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">{{ sv.sleep }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:{{ sw.free }};transition:width .9s .25s cubic-bezier(.2,.8,.2,1);overflow:hidden;flex:none;box-sizing:border-box;border:1.5px dashed rgba(255,255,255,.45);border-left:0;border-right:0\">\n              <div style=\"padding:16px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;white-space:nowrap\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Free<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">{{ sv.free }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:{{ sw.work }};transition:width .9s .5s cubic-bezier(.2,.8,.2,1);overflow:hidden;flex:none;position:relative\">\n              <div style=\"position:absolute;inset:0;display:flex\"><div style=\"flex:{{ sv.pk }};background:#f0508a;transition:flex .6s\"><\u002Fdiv><div style=\"flex:{{ sv.gr }};background:#4cc878;transition:flex .6s\"><\u002Fdiv><div style=\"flex:{{ sv.pu }};background:#a970ec;transition:flex .6s\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"position:relative;padding:16px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;white-space:nowrap;color:#101114\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Work<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">{{ sv.work }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:12px;color:#c2c5cb\">\n            <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"5\"><span>{{ t }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:56px;align-items:center;margin-top:clamp(80px,9vw,130px)\">\n          <div style=\"flex:0 0 auto;margin:0 auto\">\n            <dc-import name=\"AppPhone\" screen=\"absolute\" theme=\"dark\" hint-size=\"308px,648px\"><\u002Fdc-import>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 420px;max-width:620px;font-size:19px;line-height:1.5\">\n            <p style=\"margin:0;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400\">Absolute Time shows your entire day as a single view. Your work appears as a proportion of your total available time, not just as an isolated number. This might change the way you see your day.<\u002Fp>\n            <p style=\"margin:32px 0 0;color:#c8cbd1\">When you track 7 hours of focused work and see it against a full 24-hour day with sleep and free time marked out, the picture becomes clear.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"goal\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(160px,16vw,240px) clamp(20px,4vw,56px) 0\">\n      <div style=\"background:var(--green);color:#0f1a12;display:flex;flex-wrap:wrap;gap:40px;padding:clamp(32px,5vw,72px);position:relative\">\n        <div style=\"flex:1 1 480px;min-width:0\">\n          <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">05 — Daily goal feature<\u002Fdiv>\n          <h2 style=\"margin:28px 0 0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Daily<span style=\"display:block;padding-left:22%\">goal<\u002Fspan><\u002Fh2>\n          <p style=\"margin:40px 0 0;max-width:560px;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400\">Set a target. WorkTime shows a line on your graph marking your daily goal — and whether you hit it.<\u002Fp>\n          <div style=\"margin-top:40px;max-width:560px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">Your daily goal<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9\">{{ goalLabel }}<\u002Fspan><\u002Fdiv>\n            \n            <input type=\"range\" min=\"4\" max=\"8\" step=\"0.5\" value=\"{{ goal }}\" sc-camel-on-change=\"{{ onGoal }}\" aria-label=\"Daily goal in hours\" style=\"width:100%;margin:14px 0 0;accent-color:#0f1a12;cursor:pointer;height:28px\"><div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:4px\"><span>4h<\u002Fspan><span>{{ metText }}<\u002Fspan><span>8h<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:0;margin-top:40px;border-top:1.5px solid #0f1a12\">\n            <sc-for list=\"{{ goalRows }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"padding:14px 12px 0 0\"><div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">{{ g.k }}<\u002Fdiv><div style=\"font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9;margin-top:6px\">{{ g.v }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;margin:0 auto -120px;position:relative;z-index:2;align-self:flex-start\">\n          <dc-import name=\"AppPhone\" screen=\"stats\" theme=\"dark\" goal=\"{{ goal }}\" goal-mode=\"{{ true }}\" hint-size=\"308px,648px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"how\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(200px,18vw,260px) clamp(20px,4vw,56px) 0\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between\">\n        <h2 style=\"margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">\n          <span style=\"display:block;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-stretch:100%;margin-bottom:28px\">06 — Basics<\u002Fspan>How it works<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;max-width:260px;line-height:1.5\">Pick a panel to open it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:{{ galDir }};gap:8px;height:{{ galH }};margin-top:56px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ s.select }}\" style=\"flex:{{ s.flex }};min-height:{{ s.minH }};min-width:0;background:{{ s.color }};color:#101114;position:relative;overflow:hidden;cursor:{{ s.cursor }};transition:flex .6s cubic-bezier(.2,.8,.2,1)\">\n            <sc-if value=\"{{ s.closedH }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;inset:0;display:flex;align-items:center;gap:20px;padding:0 20px\"><span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">{{ s.num }}<\u002Fspan><span style=\"font-stretch:62%;font-weight:800;font-size:32px;line-height:1;text-transform:uppercase\">{{ s.title }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ s.closedV }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:24px;padding:22px 0\">\n                <span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">{{ s.num }}<\u002Fspan>\n                <span style=\"writing-mode:vertical-rl;transform:rotate(180deg);font-stretch:62%;font-weight:800;font-size:clamp(44px,4.4vw,64px);line-height:.9;text-transform:uppercase;white-space:nowrap\">{{ s.title }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ s.active }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"position:absolute;inset:0;padding:clamp(24px,3.4vw,48px);display:flex;flex-wrap:wrap;gap:32px;align-content:flex-start;overflow:hidden\">\n                <div style=\"flex:1 1 300px;max-width:440px;display:flex;flex-direction:column;min-height:min(100%,300px)\">\n                  <span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">{{ s.num }} / 04<\u002Fspan>\n                  <div style=\"margin-top:auto;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">{{ s.title }}<\u002Fdiv>\n                  <p style=\"margin:24px 0 0;font-size:19px;line-height:1.5;text-wrap:pretty\">{{ s.text }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"flex:1 1 320px;position:relative;align-self:center;height:680px;min-width:0\">\n                  <sc-if value=\"{{ s.isTimer }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;left:0;top:0;z-index:2\"><dc-import name=\"AppPhone\" screen=\"timer\" theme=\"dark\" hint-size=\"308px,648px\"><\u002Fdc-import><\u002Fdiv>\n                    <div style=\"position:absolute;left:170px;top:32px;z-index:1\"><dc-import name=\"AppPhone\" screen=\"timer-idle\" theme=\"light\" hint-size=\"308px,648px\"><\u002Fdc-import><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ s.isBreak }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;left:0;top:16px\"><dc-import name=\"AppPhone\" screen=\"break\" theme=\"dark\" hint-size=\"308px,648px\"><\u002Fdc-import><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ s.isSessions }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;left:0;top:16px\"><dc-import name=\"AppPhone\" screen=\"sessions\" theme=\"light\" hint-size=\"308px,648px\"><\u002Fdc-import><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ s.isPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;left:0;bottom:24px;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Hidden.<span style=\"display:block;padding-left:12%\">Still<\u002Fspan><span style=\"display:block\">counted.<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"data\" style=\"scroll-margin-top:70px;max-width:1440px;margin:0 auto;padding:clamp(140px,14vw,200px) clamp(20px,4vw,56px) 0\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px 32px\">\n        <div style=\"flex:1 1 220px;font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding-top:14px\">07 — Your Data<\u002Fdiv>\n        <h2 style=\"flex:3 1 560px;margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Your data,<span style=\"display:block;padding-left:10%;color:var(--purplet)\">your control<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:72px\">\n        <div style=\"background:var(--ink);color:var(--bg);padding:clamp(20px,2.4vw,32px);min-height:220px;display:flex;flex-direction:column\">\n          <span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">BACKUP<\u002Fspan>\n          <div style=\"font-stretch:62%;font-weight:800;font-size:clamp(64px,7vw,110px);line-height:.8;margin-top:auto;text-transform:uppercase\">1 file<\u002Fdiv>\n          <p style=\"margin:18px 0 0;font-size:19px;line-height:1.5\">Backup — one file you manage.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:var(--pink);color:#101114;padding:clamp(20px,2.4vw,32px);min-height:220px;display:flex;flex-direction:column;margin-top:clamp(0px,3vw,40px)\">\n          <span style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">CSV IMPORT &amp; EXPORT<\u002Fspan>\n          <div style=\"font-stretch:62%;font-weight:800;font-size:clamp(64px,7vw,110px);line-height:.8;margin-top:auto;text-transform:uppercase\">.csv<\u002Fdiv>\n          <p style=\"margin:18px 0 0;font-size:19px;line-height:1.5\">CSV export — load into a spreadsheet or migrate from another tracker.<\u002Fp>\n          <p style=\"margin:8px 0 0;font-size:19px;line-height:1.5\">CSV import — bring your history from another tracker and keep years of statistics.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"max-width:1440px;margin:0 auto;padding:clamp(160px,16vw,240px) clamp(20px,4vw,56px) 80px;overflow:hidden\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px 40px;align-items:center;justify-content:space-between\">\n        <div style=\"font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em;white-space:nowrap\">Work<span style=\"color:var(--acct)\">Time<\u002Fspan><\u002Fdiv>\n        <a href=\"#\" title=\"Coming soon to Google Play\" style=\"display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:14px 26px 14px 20px\">\n          <div style=\"width:16px;height:19px;background:var(--acc);clip-path:polygon(0 0,100% 50%,0 100%)\"><\u002Fdiv>\n          <div><div style=\"font-family:'JetBrains Mono', monospace;font-size:10.5px;letter-spacing:.1em\">DOWNLOAD ON<\u002Fdiv><div style=\"font-size:21px;font-weight:700;margin-top:1px\">Google Play<\u002Fdiv><\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:40px 0 0;font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:400;max-width:560px\">Free. No account. No ads. Your hours, measured honestly.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:1440px;margin:0 auto;padding:clamp(60px,8vw,120px) clamp(20px,4vw,56px) 120px;display:flex;flex-wrap:wrap;gap:32px\">\n      <div style=\"flex:1 1 220px\"><a href=\"#top\" style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">← BACK TO WORKTIME<\u002Fa><\u002Fdiv>\n      <article style=\"flex:3 1 560px;max-width:820px;font-size:19px;line-height:1.5\">\n        <h1 style=\"margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Privacy Policy<\u002Fh1>\n        <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:28px\">LAST UPDATED · SEPTEMBER 27, 2026<\u002Fdiv>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:56px 0 12px\">Summary<\u002Fh3>\n        <p style=\"margin:0\">WorkTime does not collect, transmit or sell any personal data. Everything you enter stays on your device.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Data stored on your device<\u002Fh3>\n        <p style=\"margin:0\">Areas, projects, tasks, sessions and settings are stored locally in the app's private storage. The app requires no account and does not connect to the internet. Uninstalling the app deletes this data.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Backups and CSV files<\u002Fh3>\n        <p style=\"margin:0\">When you create a backup or export a CSV file, the file is saved to a location you choose. You control where it goes and who can access it. The app reads a file only when you choose to restore or import it.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Analytics and third parties<\u002Fh3>\n        <p style=\"margin:0\">WorkTime contains no analytics, advertising or tracking SDKs, and shares no data with third parties.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Changes and contact<\u002Fh3>\n        <p style=\"margin:0\">If this policy changes, the new version will be published on this page with an updated date. Questions can be raised through the project's GitHub page.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isTerms }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width:1440px;margin:0 auto;padding:clamp(60px,8vw,120px) clamp(20px,4vw,56px) 120px;display:flex;flex-wrap:wrap;gap:32px\">\n      <div style=\"flex:1 1 220px\"><a href=\"#top\" style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase\">← BACK TO WORKTIME<\u002Fa><\u002Fdiv>\n      <article style=\"flex:3 1 560px;max-width:820px;font-size:19px;line-height:1.5\">\n        <h1 style=\"margin:0;font-stretch:62%;font-weight:800;text-transform:uppercase;font-size:clamp(60px,8.4vw,136px);line-height:.86;letter-spacing:-.01em\">Terms of Use<\u002Fh1>\n        <div style=\"font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-top:28px\">LAST UPDATED · SEPTEMBER 27, 2026<\u002Fdiv>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:56px 0 12px\">Using WorkTime<\u002Fh3>\n        <p style=\"margin:0\">WorkTime is a free app for tracking your own working time. By installing or using it, you agree to these terms.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Your data<\u002Fh3>\n        <p style=\"margin:0\">All data is stored only on your device. You are responsible for creating backups. Data lost through uninstalling, device failure or reset cannot be recovered by the developer.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">No warranty<\u002Fh3>\n        <p style=\"margin:0\">The app is provided \"as is\", without warranties of any kind. Time totals are calculated from the sessions you record and are not intended as a legal or payroll record.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Limitation of liability<\u002Fh3>\n        <p style=\"margin:0\">To the extent permitted by law, the developer is not liable for any damages arising from the use of, or inability to use, the app.<\u002Fp>\n        <h3 style=\"font-size:clamp(24px,2.4vw,34px);line-height:1.3;font-weight:600;margin:44px 0 12px\">Changes<\u002Fh3>\n        <p style=\"margin:0\">These terms may be updated. The current version is always published on this page.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:1px solid var(--line)\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:32px clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;font-size:16px\">\n      <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:30px;height:30px;border-radius:{{ logoRadius }};overflow:hidden;background:#181c24;flex:none;box-sizing:border-box;border:{{ logoBorder }}\"><img src=\"fc1a3b20-a02a-456d-9693-5a5ab6200229\" alt=\"\" style=\"width:100%;height:100%;display:block;transform:scale(1.35)\"><\u002Fdiv>© 2026 WorkTime<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:28px;line-height:1\">\n        <a href=\"https://github.com/kirisinclair/Worktime\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;gap:6px\">GitHub<span style=\"font-size:.85em\">↗<\u002Fspan><\u002Fa>\n        <a href=\"privacy.html\" style=\"display:flex;align-items:center\">Privacy Policy<\u002Fa>\n        <a href=\"terms.html\" style=\"display:flex;align-items:center\">Terms of Use<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: this.props.defaultTheme || 'dark', page: 'home', step: 0, absMode: 'day', stripOn: false, goal: 5, narrow: typeof window !== 'undefined' && window.innerWidth < 820, menuOpen: false };\n  stripRef = (el) => {\n    if (!el || this.stripEl === el) return;\n    this.stripEl = el;\n    if (this.stripIo) this.stripIo.disconnect();\n    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) { this.setState({ stripOn: true }); return; }\n    this.stripIo = new IntersectionObserver((es, obs) => { if (es.some(e => e.isIntersecting)) { this.setState({ stripOn: true }); obs.disconnect(); } }, { threshold: 0.4 });\n    this.stripIo.observe(el);\n    setTimeout(() => { const r = el.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) this.setState({ stripOn: true }); }, 1500);\n  };\n  componentDidMount() {\n    try { const t = localStorage.getItem('wt-site-theme'); if (t) this.applyTheme(t); else this.applyTheme(this.state.theme); } catch (e) {}\n    this.onHash = () => this.route();\n    window.addEventListener('hashchange', this.onHash);\n    this.route();\n    this.setupReveal();\n    this.onResize = () => { const n = window.innerWidth < 820; if (n !== this.state.narrow) this.setState({ narrow: n, menuOpen: false }); };\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n    if (window.ResizeObserver) { this.ro = new ResizeObserver(() => this.onResize()); this.ro.observe(document.documentElement); }\n  }\n  componentDidUpdate(pp, ps) { if (ps.page !== this.state.page) setTimeout(() => this.setupReveal(), 50); }\n  setupReveal() {\n    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; el.dataset.revealed = '1'; };\n    if (this.io) { this.io.disconnect(); document.querySelectorAll('[data-reveal-pending]').forEach(el => { el.removeAttribute('data-reveal-pending'); show(el); }); }\n    const io = new IntersectionObserver((es, obs) => es.forEach(e => {\n      if (e.isIntersecting) { e.target.removeAttribute('data-reveal-pending'); show(e.target); obs.unobserve(e.target); }\n    }), { threshold: 0, rootMargin: '0px 0px -8% 0px' });\n    this.io = io;\n    const els = document.querySelectorAll('section:not(#top) h2, section:not(#top) p');\n    els.forEach(el => {\n      if (el.dataset.revealed || el.getBoundingClientRect().top < window.innerHeight) return;\n      el.setAttribute('data-reveal-pending', '1');\n      el.style.opacity = '0'; el.style.transform = 'translateY(32px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1)';\n      io.observe(el);\n    });\n    clearTimeout(this.revealFallback);\n    this.revealFallback = setTimeout(() => document.querySelectorAll('[data-reveal-pending]').forEach(el => {\n      const r = el.getBoundingClientRect();\n      if (r.top < window.innerHeight && r.bottom > 0) { el.removeAttribute('data-reveal-pending'); show(el); }\n    }), 1500);\n    this.onScrollCheck = this.onScrollCheck || (() => document.querySelectorAll('[data-reveal-pending]').forEach(el => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.95) { el.removeAttribute('data-reveal-pending'); show(el); }\n    }));\n    window.removeEventListener('scroll', this.onScrollCheck);\n    window.addEventListener('scroll', this.onScrollCheck, { passive: true });\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); window.removeEventListener('resize', this.onResize); if (this.ro) this.ro.disconnect(); if (this.io) this.io.disconnect(); if (this.onScrollCheck) window.removeEventListener('scroll', this.onScrollCheck); }\n  route() {\n    const h = (location.hash || '').slice(1);\n    const page = h === 'privacy' || h === 'terms' ? h : 'home';\n    const was = this.state.page;\n    this.setState({ page }, () => {\n      if (page !== 'home') { window.scrollTo(0, 0); return; }\n      if (was !== 'home' || h === 'top') {\n        const el = h && document.getElementById(h);\n        window.scrollTo(0, el ? el.getBoundingClientRect().top + window.scrollY - 70 : 0);\n      }\n    });\n  }\n  applyTheme(t) {\n    this.setState({ theme: t });\n    document.documentElement.style.background = t === 'light' ? '#efefec' : '#15171a';\n    document.body.style.background = t === 'light' ? '#efefec' : '#15171a';\n    try { localStorage.setItem('wt-site-theme', t); } catch (e) {}\n  }\n  fmtH(x) { const m = Math.round(x * 60); const hh = Math.floor(m / 60), mm = m % 60; return mm ? hh + 'h ' + mm + 'm' : hh + 'h'; }\n  absVals() {\n    const { absMode, stripOn } = this.state;\n    const d = absMode === 'week'\n      ? { total: 168, sleep: 56, free: 66, work: 46, pk: 29.05, gr: 9.75, pu: 7.2, ticks: ['0h','42h','84h','126h','168h'] }\n      : { total: 24, sleep: 8, free: 8.8, work: 7.2, pk: 2, gr: 1.6, pu: 3.6, ticks: ['00','06','12','18','24'] };\n    const w = (v) => (stripOn ? v / d.total * 100 : 0) + '%';\n    return {\n      stripRef: this.stripRef,\n      sw: { sleep: w(d.sleep), free: w(d.free), work: w(d.work) },\n      sv: { sleep: this.fmtH(d.sleep), free: this.fmtH(d.free), work: this.fmtH(d.work), pk: d.pk, gr: d.gr, pu: d.pu },\n      ticks: d.ticks,\n      absModes: [['day','Day · 24h'],['week','Week · 168h']].map(([k, name]) => ({ name, bg: k === absMode ? '#f3f3f1' : 'transparent', fg: k === absMode ? '#101114' : '#f3f3f1', select: () => this.setState({ absMode: k }) })),\n    };\n  }\n  goalVals() {\n    const g = this.state.goal;\n    const days = [6.3, 7.1, 5.9, 8.65, 6.5, 4.8333, 7.2, 6.1167, 6.8];\n    const met = days.filter(x => x >= g - 0.001).length;\n    return {\n      goal: g, goalLabel: this.fmtH(g),\n      onGoal: (e) => this.setState({ goal: Number(e.target.value) }),\n      metText: met + ' of 9 days met',\n      goalRows: [['Day', 1], ['Week ×5', 5], ['Month ×22', 22], ['Quarter ×66', 66], ['Year ×264', 264]].map(([k, m]) => ({ k, v: this.fmtH(g * m) })),\n    };\n  }\n  renderVals() {\n    const { theme, page, step, narrow, menuOpen } = this.state;\n    const dark = theme !== 'light';\n    const defs = [\n      { key:'timer', title:'Timer', color:'var(--acc)', text:'Tap the circle to start. Tap again to pause. Swipe down to save. Swipe up to discard. Add untracked time manually.' },\n      { key:'break', title:'Breaks', color:'var(--green)', text:\"When a session ends, the app suggests a break. Breaks don't count as work.\" },\n      { key:'sessions', title:'Sessions', color:'var(--pink)', text:'Every session saves with time, project, and task. Edit or delete anytime.' },\n      { key:'privacy', title:'Archive', color:'var(--purple)', text:'Finished an area, project or task? Archive it to hide it from selection. Its statistics stay, and you can restore it anytime from Stats → Archive.' },\n    ];\n    const steps = defs.map((d, i) => ({\n      ...d, num: '0' + (i + 1), active: i === step, closed: i !== step,\n      flex: i === step ? (narrow ? '0 0 760px' : '1 1 0') : '0 0 64px', minH: '0', closedV: i !== step && !narrow, closedH: i !== step && narrow, cursor: i === step ? 'default' : 'pointer',\n      isTimer: d.key === 'timer', isBreak: d.key === 'break', isSessions: d.key === 'sessions', isPrivacy: d.key === 'privacy',\n      select: () => this.setState({ step: i }),\n    }));\n    return {\n      theme, isHome: page === 'home', isPrivacy: page === 'privacy', isTerms: page === 'terms',\n      setDark: () => this.applyTheme('dark'), setLight: () => this.applyTheme('light'),\n      darkBg: dark ? 'var(--ink)' : 'transparent', darkFg: dark ? 'var(--bg)' : 'var(--ink)',\n      lightBg: !dark ? 'var(--ink)' : 'transparent', lightFg: !dark ? 'var(--bg)' : 'var(--ink)',\n      steps,\n      narrow, menuOpen: narrow && menuOpen, navDisplay: narrow ? 'none' : 'flex',\n      menuLabel: menuOpen ? 'Close' : 'Menu',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      menuLinks: [['#levels','3-level system',false],['#stats','Stats',false],['#absolute','Absolute time',true],['#goal','Time goal',true],['#data','Data',false]].map(([href,name,feat]) => ({ href, name, feat })),\n      heroH: narrow ? '668px' : '720px', heroSecond: narrow ? 'none' : 'block', heroPhoneL: narrow ? '50%' : '0', heroPhoneX: narrow ? '-50%' : '0',\n      galDir: narrow ? 'column' : 'row', galH: narrow ? 'auto' : '760px',\n      toggleTheme: () => this.applyTheme(dark ? 'light' : 'dark'),\n      themeTitle: dark ? 'Switch to light theme' : 'Switch to dark theme',\n      themeRot: dark ? '0deg' : '180deg',\n      ...this.absVals(),\n      ...this.goalVals(),\n      logoRadius: '50%',\n      logoBorder: dark ? '2px solid #ffffff' : '0 none',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
